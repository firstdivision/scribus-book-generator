document:
  units: mm
  layout: facing_pages
  first_page: right

page:
  size: A4
  orientation: landscape
  background_color_rgb: [239, 226, 205]

bleed:
  top: 3.18
  bottom: 3.18
  inside: 3.18
  outside: 3.18

safety_margin:
  top: 12.7
  bottom: 12.7
  inside: 12.7
  outside: 12.7

chapter_headings:
  font:
    family: URW Bookman
    style: Demi
    size_pt: 28

  color_rgb: [40, 40, 40]
  # Optional title-frame fill and independent solid borders.
  background_color_rgb: [245, 235, 220]
  borders:
    bottom: {color_rgb: [40, 40, 40], width_pt: 1}
  #   left: {color_rgb: [40, 40, 40], width_pt: 1}
  #   top: {color_rgb: [40, 40, 40], width_pt: 1}
  #   right: {color_rgb: [40, 40, 40], width_pt: 1}
  alignment: left

  spacing_mm:
    top: 20
    bottom: 10

images:
  sorting: date-ascending
  border:
    color_rgb: [255, 255, 255]
    width_pt: 11

  spacing_mm:
    top: 5
    bottom: 5
    inside: 5
    outside: 5
    
  sizing:
    max_width_mm: 120
    max_height_mm: 120

  placement:
    snap_to_edge: true
    snap_target: content_area
    allowed_edges:
      - outside
      - inside
      - top
      - bottom
    preferred_edges:
      - outside
      - inside
      - top
      - bottom

    edge_selection: random

    edge_gap_mm: 0
  leftovers:
    gallery_columns: 3

page_numbers:
  enabled: true
  start_on_page: 1
  start_number: 1
  format: arabic
  position: bottom_outside

  font:
    family: Source Serif 4
    style: Regular
    size_pt: 9

  color_rgb: [80, 80, 80]

  offset_mm:
    top: 7
    bottom: 7
    inside: 10
    outside: 10

  hide_on:
    - chapter_opening
    - full_page_image
    - blank
