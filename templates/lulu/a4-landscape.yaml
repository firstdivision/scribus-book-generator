document:
  units: mm
  layout: facing_pages
  first_page: right

page:
  size: A4
  orientation: landscape
  background_color_rgb: [248, 244, 232]

bleed:
  top: 3.18
  bottom: 3.18
  inside: 3.18
  outside: 3.18

safety_margin:
  top: 12.7
  bottom: 12.7
  inside: 12.7
  outside: 12.7

images:
  border:
    color_rgb: [255, 255, 255]
    width_pt: 3

  spacing_mm:
    top: 5
    bottom: 5
    inside: 5
    outside: 5

page_numbers:
  enabled: true
  start_on_page: 1
  start_number: 1
  format: arabic
  position: bottom_outside

  font:
    family: Source Serif 4
    style: Regular
    size_pt: 9

  color_rgb: [80, 80, 80]

  offset_mm:
    top: 7
    bottom: 7
    inside: 10
    outside: 10

  hide_on:
    - chapter_opening
    - full_page_image
    - blank